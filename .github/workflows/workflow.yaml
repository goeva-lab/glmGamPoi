on:
  push:

jobs:
  workflow:
    runs-on: 'ubuntu-latest'
    container: 'archlinux:latest'
    permissions:
      contents: 'read'
    env:
      PKG_SYSREQS: 'FALSE'
      R_LIBS_USER: '/home/runner/R/library/'

    steps:
      - run: |
          set -euxo pipefail

          pacman -Syu --noconfirm
          pacman -S zlib-ng-compat <<< $'y\n'

          pacman -S --noconfirm \
            'r' 'blas-openblas' \
            'base-devel' 'gcc-fortran' 'clang' 'git' \
            'libuv' 'libxml2' 'curl' \
            'fontconfig' 'fribidi' 'harfbuzz' 'freetype2' \
            'libjpeg-turbo' 'libpng' 'libtiff' 'libwebp' \
            'texinfo' 'texlive-fontsrecommended' 'texlive-latex' 'texlive-latexrecommended' 'pandoc'

          # R_LIBS_USER directory must exist for R to use it
          mkdir -p /home/runner/R/library

          # set timezone to resolve warning in base::Sys.timezone
          ln -s /usr/share/zoneinfo/America/Toronto /etc/localtime

      - uses: 'actions/checkout@v7'
        with:
          submodules: true

      - uses: 'posit-dev/setup-air@v1'
      - run: |
          air format --check .
      - uses: 'etiennebacher/setup-jarl@v0.1.1'

      - run: |
          set -euxo pipefail

          for f in 'src/'*'.cpp' 'inst/include/'*'.h'; do
            dco="$(diff "${f}" <(clang-format "${f}"))"
            if [[ -n "${dco}" ]]; then
              echo "clang-format diff for: ${f}"
              echo "${dco}"
              (exit 1)
            fi
          done

      - uses: 'actions/cache/restore@v5'
        with:
          path: |
            /home/runner/R/library/
          key: 'pak-R-library-${{ runner.os }}-${{ runner.arch }}'
      - run: |
          if (!base::requireNamespace("pak", quietly = TRUE)) {
            utils::install.packages("pak", repos = "https://cloud.r-project.org/")
            base::requireNamespace("pak")
          }
          pak::pak("pak")
          pak::pak(c("Rcpp", "RcppEigen", "bioc::beachmat", "bioc::assorthead"))
        shell: 'Rscript {0}'

      - run: |
          set -euxo pipefail

          for f in 'src/'*'.cpp' 'inst/include/'*'.h'; do
            clang-tidy "${f}" -- -I"${R_LIBS_USER}"{Rcpp,RcppEigen,beachmat,assorthead}'/include'  2>/dev/null # suppress messages re: compilation flags
          done

          # for roxygenize boostrap to work
          echo '# Generated by roxygen2: do not edit by hand' > ./NAMESPACE

      - run: |
          pak::pak(c("Rcpp", "roxygen2"))

          Rcpp::compileAttributes()
          pak::local_install_dev_deps()
          roxygen2::roxygenize()
        shell: 'Rscript {0}'
      - run: |
          pak::pak(c("lintr"))

          base::quit(save = "no", status = length(print(lintr::lint_package())) != 0)
        shell: 'Rscript {0}'
      - run: |
          pak::pak(c("testthat"))

          testthat::test_local(reporter = testthat::LocationReporter)
        shell: 'Rscript {0}'
      - run: |
          pak::pak(c("devtools"))

          devtools::check(error_on = "error", args = c("--no-tests", "--timings"), vignettes = FALSE)
        shell: 'Rscript {0}'
      - run: |
          pak::pak(c("pkgbuild", "devtools", "pkgdown"))

          pkgbuild::build(dest_path = "./glmGamPoi2.tar.gz")

          devtools::build_manual(path = ".")
          base::file.rename(list.files(pattern = "^glmGamPoi2_.+\\.pdf$"), "./glmGamPoi2.pdf")

          pkgdown::build_site(
            examples = FALSE,
            devel = FALSE, new_process = TRUE, install = TRUE, preview = FALSE,
            override = list(
              destination = "./pkgdown-dist",
              repo = list(url = list(source = "https://github.com/${{ github.repository }}/tree/${{ github.sha }}"))
            )
          )
        shell: 'Rscript {0}'

      - uses: 'actions/cache/save@v5'
        with:
          path: |
            /home/runner/R/library/
          key: 'pak-R-library-${{ runner.os }}-${{ runner.arch }}'

      - uses: 'actions/upload-artifact@v7'
        with:
          name: 'package archive'
          archive: false
          path: 'glmGamPoi2.tar.gz'
      - uses: 'actions/upload-artifact@v7'
        with:
          name: 'manual'
          archive: false
          path: 'glmGamPoi2.pdf'
      - uses: 'actions/upload-artifact@v7'
        with:
          name: 'pkgdown documentation website archive'
          path: 'pkgdown-dist/'
